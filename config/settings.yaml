# Central configuration for the whole pipeline and the API.
# Paths are relative to the project root.

seed: 42

paths:
  raw_csv: data/raw/Amazon_Unlocked_Mobile.csv
  interim_dir: data/interim
  processed_dir: data/processed
  artifacts_dir: artifacts
  aspects_file: config/aspects.yaml
  evaluation_dir: evaluation

data:
  min_reviews_per_product: 15      # products with fewer reviews are excluded (cold start)
  max_reviews_per_product: 250     # cap so a few very popular phones don't dominate compute
  min_review_words: 3              # shorter reviews still count for the star rating, not for text
  min_english_ratio: 0.12          # share of tokens that are common English function words
  family_overlap_threshold: 0.5    # shared-review ratio for merging colour/storage variants
  family_min_shared: 5
  max_price_usd: 2500              # prices above this are treated as data errors
  accessory_keywords:
    - "case"
    - "cover"
    - "screen protector"
    - "tempered glass"
    - "charger"
    - "cable"
    - "holster"
    - "adapter"
    - "stylus"
    - "smartwatch"
    - "smart watch"
    - "bluetooth headset"

text:
  min_sentence_words: 3
  max_sentences_per_product: 400

embeddings:
  # Hugging Face model id or a local folder. Can be overridden with RR_EMBEDDING_MODEL.
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 128
  device: cpu

sentiment:
  backend: weak_supervised          # one of: weak_supervised | vader | transformer
  transformer_model: yangheng/deberta-v3-base-absa-v1.1
  neutral_band: 0.3                 # |v| below this is shown as neutral
  vader_neutral_band: 0.05          # standard VADER compound threshold
  positive_min_rating: 4
  negative_max_rating: 2
  max_train_examples: 60000

aggregation:
  aspect_prior_strength: 5          # k in the Bayesian smoothing of aspect scores
  rating_prior_strength: 20         # m in the Bayesian average rating
  min_mentions_for_claim: 3         # below this the UI says "insufficient evidence"

retrieval:
  candidate_pool: 100
  title_weight: 0.4                 # semantic R = w*title_sim + (1-w)*review_evidence_sim
  evidence_top_k: 5                 # top-k mean of sentence similarities per product
  tfidf_max_features: 50000

scoring:
  alpha: 0.55                       # relevance
  beta: 0.30                        # requested-aspect sentiment
  gamma: 0.15                       # overall Bayesian rating
  default_aspect_weight: 1.0
  emphasis_weight: 1.5

api:
  default_top_k: 10
  max_top_k: 50
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
